services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -c "npm install -g pnpm@11.22.0 && pnpm install && pnpm dev"
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development

volumes:
  node_modules:
