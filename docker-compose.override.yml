services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    command: sh -c "npm install -g pnpm@11.22.0 && pnpm install && pnpm run build && pnpm dev"
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy:/etc/caddy
    depends_on:
      - app

volumes:
  node_modules:
